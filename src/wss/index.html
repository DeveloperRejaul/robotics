<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Devices</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e3e6ea;
    --accent: #2563eb; --accent-text: #ffffff; --ok: #16a34a; --bad: #9ca3af; --danger: #dc2626;
    --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #eceef2; --muted: #98a0ad; --line: #2a2f38;
      --accent: #4f8cff; --accent-text: #0b0d11; --ok: #34d399; --bad: #6b7280; --danger: #f87171;
      --field: #12151a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 17px; margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 16px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 11px 12px; font-size: 16px; color: var(--text);
                  background: var(--field); border: 1px solid var(--line); border-radius: 10px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); padding: 10px 14px; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.link { border: 0; background: none; color: var(--accent); padding: 4px 6px; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .6; cursor: default; }
  .wide { width: 100%; margin-top: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 4px; }
  .tabs button { flex: 1; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .msg { font-size: 14px; margin-top: 10px; min-height: 1.2em; color: var(--danger); }
  .msg.ok { color: var(--ok); }
  .muted { color: var(--muted); font-size: 13px; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .pill.on { color: var(--ok); border-color: var(--ok); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 6px; }
  .on .dot, .dot.on { background: var(--ok); }
  .values { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .value { background: var(--bg); border-radius: 10px; padding: 10px; text-align: center; }
  .value b { display: block; font-size: 22px; }
  .value span { font-size: 12px; color: var(--muted); }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
  .switch { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .toggle { width: 46px; height: 26px; border-radius: 99px; background: var(--bad); position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
                   border-radius: 50%; background: #fff; transition: left .15s; }
  .toggle.on { background: var(--ok); } .toggle.on::after { left: 23px; }
  .history { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 4px 2px; text-align: left; } th { color: var(--muted); font-weight: 500; }
  svg { width: 100%; height: 70px; display: block; margin-bottom: 8px; }
  polyline { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .empty { text-align: center; color: var(--muted); padding: 24px 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>

  <!-- LOGIN / REGISTER -->
  <section id="auth" hidden>
    <header><h1>My Devices</h1></header>
    <div class="card">
      <div class="tabs">
        <button id="tab-login" class="on" type="button">Log in</button>
        <button id="tab-register" type="button">Create account</button>
      </div>
      <form id="auth-form">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" autocapitalize="none" required minlength="3" maxlength="32">
        <label for="password">Password (at least 8 characters)</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="8">
        <button class="primary wide" id="auth-submit" type="submit">Log in</button>
        <div class="msg" id="auth-msg"></div>
      </form>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="app" hidden>
    <header>
      <h1>My Devices</h1>
      <div><span class="muted" id="who"></span> <button class="link" id="logout" type="button">Log out</button></div>
    </header>

    <div id="devices"></div>

    <div class="card">
      <div class="row">
        <h2>Add a device</h2>
        <button class="link" id="add-toggle" type="button">Show</button>
      </div>
      <form id="add-form" hidden>
        <p class="muted">Enter the Device ID and Claim code printed on the box.</p>
        <label for="dev-id">Device ID</label>
        <input id="dev-id" autocapitalize="none" autocomplete="off" placeholder="esp32-xxxxxxxxxxxx" required>
        <label for="dev-code">Claim code</label>
        <input id="dev-code" autocapitalize="characters" autocomplete="off" placeholder="ABCD-EFGH" required>
        <label for="dev-name">Name (optional)</label>
        <input id="dev-name" maxlength="40" placeholder="Living room">
        <button class="primary wide" type="submit">Add device</button>
        <div class="msg" id="add-msg"></div>
      </form>
    </div>
  </section>

</main>

<script src="/socket.io.min.js"></script>
<script>
"use strict";
const API = "";   // the page and the API come from the same server

// ---------- tiny helpers ----------
const $ = (id) => document.getElementById(id);

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids) el.append(kid);   // append() inserts text safely, never HTML
  return el;
}

let token = null;
try { token = localStorage.getItem("token"); } catch (e) {}
function saveToken(value) {
  token = value;
  try { value ? localStorage.setItem("token", value) : localStorage.removeItem("token"); } catch (e) {}
}

function errorText(body, fallback) {
  if (body && typeof body.detail === "string") return body.detail;
  if (body && Array.isArray(body.detail)) return body.detail.map((d) => d.msg).join(". ");
  return fallback;
}

async function api(path, options = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  let response;
  try {
    response = await fetch(API + path, { ...options, headers });
  } catch (e) {
    throw new Error("Cannot reach the server");
  }
  let body = null;
  try { body = await response.json(); } catch (e) {}
  if (response.status === 401 && token && path !== "/api/login") {
    showAuth();
    throw new Error("Please log in again");
  }
  if (!response.ok) throw new Error(errorText(body, "Something went wrong (" + response.status + ")"));
  return body;
}

// ---------- auth screen ----------
let mode = "login";
function setMode(next) {
  mode = next;
  $("tab-login").classList.toggle("on", mode === "login");
  $("tab-register").classList.toggle("on", mode === "register");
  $("auth-submit").textContent = mode === "login" ? "Log in" : "Create account";
  $("password").autocomplete = mode === "login" ? "current-password" : "new-password";
  $("auth-msg").textContent = "";
}
$("tab-login").onclick = () => setMode("login");
$("tab-register").onclick = () => setMode("register");

$("auth-form").onsubmit = async (event) => {
  event.preventDefault();
  const button = $("auth-submit");
  button.disabled = true;
  $("auth-msg").textContent = "";
  try {
    const result = await api(mode === "login" ? "/api/login" : "/api/register", {
      method: "POST",
      body: JSON.stringify({ username: $("username").value.trim(), password: $("password").value }),
    });
    saveToken(result.token);
    $("password").value = "";
    showApp(result.username);
  } catch (e) {
    $("auth-msg").textContent = e.message;
  } finally {
    button.disabled = false;
  }
};

$("logout").onclick = async () => {
  try { await api("/api/logout", { method: "POST" }); } catch (e) {}
  showAuth();
};

function showAuth() {
  saveToken(null);
  stopLive();
  cards.forEach((c) => c.el.remove());
  cards.clear();
  $("app").hidden = true;
  $("auth").hidden = false;
}

// ---------- device cards ----------
const cards = new Map();           // device id -> { el, update(d) }
const INTERVALS = [[5, "5 seconds"], [10, "10 seconds"], [30, "30 seconds"], [60, "1 minute"],
                   [300, "5 minutes"], [900, "15 minutes"], [3600, "1 hour"]];

function fmt(value, unit) {
  return value === null || value === undefined ? "–" : (Math.round(value * 10) / 10) + unit;
}

function sparkline(points) {
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 100 40");
  svg.setAttribute("preserveAspectRatio", "none");
  const values = points.map((p) => p.temperature).filter((v) => v !== null);
  if (values.length > 1) {
    const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
    const line = document.createElementNS(svgNS, "polyline");
    line.setAttribute("points", values.map((v, i) =>
      (i / (values.length - 1) * 100).toFixed(1) + "," + (36 - (v - min) / span * 32).toFixed(1)).join(" "));
    svg.append(line);
  }
  return svg;
}

function makeCard(device) {
  let latest = device;
  let pendingLed = null, pendingUntil = 0;
  let historyOpen = false;

  const nameEl = h("b", {});
  const statusEl = h("span", { class: "pill" });
  const seenEl = h("div", { class: "muted" });
  const tempEl = h("b", {}), humEl = h("b", {}), sensEl = h("b", {});
  const toggle = h("span", { class: "toggle" });
  const ledText = h("span", {});
  const ledBtn = h("button", { type: "button", class: "switch" }, h("span", {}, "LED ", ledText), toggle);
  const select = h("select", {}, ...INTERVALS.map(([v, label]) => h("option", { value: v }, label)));
  const historyBox = h("div", { class: "history", hidden: "" });
  const historyBtn = h("button", { type: "button", class: "link" }, "History");
  const removeBtn = h("button", { type: "button", class: "link danger" }, "Remove");
  const note = h("div", { class: "muted" });

  const el = h("div", { class: "card" },
    h("div", { class: "row" }, h("div", {}, nameEl, h("div", { class: "muted" }, device.id)), statusEl),
    seenEl,
    h("div", { class: "values" },
      h("div", { class: "value" }, tempEl, h("span", {}, "Temperature")),
      h("div", { class: "value" }, humEl, h("span", {}, "Humidity")),
      h("div", { class: "value" }, sensEl, h("span", {}, "Sensor"))),
    h("div", { class: "controls" },
      h("div", {}, ledBtn),
      h("div", {}, h("label", { style: "margin-top:0" }, "Save history every"), select)),
    note,
    h("div", { class: "row", style: "margin-top:8px" }, historyBtn, removeBtn),
    historyBox);

  async function send(command) {
    try { await api("/api/devices/" + encodeURIComponent(device.id) + "/cmd",
                    { method: "POST", body: JSON.stringify(command) }); note.textContent = ""; }
    catch (e) { note.textContent = e.message; pendingLed = null; }
  }

  ledBtn.onclick = () => {
    const current = latest.state ? latest.state.led : false;
    pendingLed = !current; pendingUntil = Date.now() + 12000;
    send({ led: pendingLed });
    render();
  };
  select.onchange = () => send({ interval: Number(select.value) });

  async function loadHistory() {
    try {
      const rows = (await api("/api/devices/" + encodeURIComponent(device.id) + "/history?limit=40")).reverse();
      historyBox.replaceChildren(sparkline(rows));
      if (!rows.length) { historyBox.append(h("div", { class: "muted" }, "No history yet.")); return; }
      const body = h("tbody", {});
      rows.slice(-8).reverse().forEach((r) => body.append(h("tr", {},
        h("td", {}, new Date(r.ts * 1000).toLocaleTimeString()),
        h("td", {}, fmt(r.temperature, " °C")), h("td", {}, fmt(r.humidity, " %")), h("td", {}, fmt(r.sensor_value, "")))));
      historyBox.append(h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Time"), h("th", {}, "Temp"),
        h("th", {}, "Humidity"), h("th", {}, "Sensor"))), body));
    } catch (e) { historyBox.replaceChildren(h("div", { class: "muted" }, e.message)); }
  }
  historyBtn.onclick = () => {
    historyOpen = !historyOpen;
    historyBox.hidden = !historyOpen;
    historyBtn.textContent = historyOpen ? "Hide history" : "History";
    if (historyOpen) loadHistory();
  };

  removeBtn.onclick = async () => {
    if (!confirm("Remove this device from your account? Its history will be deleted.")) return;
    try { await api("/api/devices/" + encodeURIComponent(device.id), { method: "DELETE" }); refresh(); }
    catch (e) { note.textContent = e.message; }
  };

  function render() {
    const d = latest, led = d.state ? d.state.led : false;
    nameEl.textContent = d.name;
    statusEl.textContent = d.online ? "Online" : "Offline";
    statusEl.className = "pill" + (d.online ? " on" : "");
    seenEl.textContent = d.age === null ? "Waiting for the device to connect..."
                       : d.online ? "" : "Last seen " + d.age + " s ago";
    seenEl.hidden = d.online;
    tempEl.textContent = fmt(d.last && d.last.temperature, " °C");
    humEl.textContent = fmt(d.last && d.last.humidity, " %");
    sensEl.textContent = fmt(d.last && d.last.sensor_value, "");
    if (pendingLed !== null && (led === pendingLed || Date.now() > pendingUntil)) pendingLed = null;
    const shown = pendingLed !== null ? pendingLed : led;
    toggle.className = "toggle" + (shown ? " on" : "");
    ledText.textContent = pendingLed !== null ? "(sending...)" : (led ? "on" : "off");
    ledBtn.disabled = !d.online;
    if (document.activeElement !== select) select.value = String(d.interval);
  }

  return {
    el,
    update(d) { latest = d; render(); if (historyOpen && Date.now() % 4 < 2) loadHistory(); },
  };
}

// ---------- dashboard ----------
let socket = null;
const emptyNote = h("div", { class: "card empty" }, "No devices yet. Add one below with the Device ID and Claim code printed on its box.");

// Show a list of devices (sent live by the server through Socket.IO)
function apply(list) {
  const box = $("devices");
  const seen = new Set();
  for (const d of list) {
    seen.add(d.id);
    if (!cards.has(d.id)) { const c = makeCard(d); cards.set(d.id, c); box.append(c.el); }
    cards.get(d.id).update(d);
  }
  for (const [id, c] of cards) if (!seen.has(id)) { c.el.remove(); cards.delete(id); }
  if (list.length) emptyNote.remove(); else if (!emptyNote.isConnected) box.append(emptyNote);
}

async function refresh() {
  if (!token) return;
  try { apply(await api("/api/devices")); } catch (e) { /* the live connection retries by itself */ }
}

// A live connection: the server pushes the device list whenever something changes
function connectLive() {
  stopLive();
  socket = io("/web", { auth: { token }, transports: ["websocket"] });
  socket.on("devices", apply);
  socket.on("connect_error", (error) => {
    if (error && error.message === "not logged in") showAuth();
  });
}

function stopLive() { if (socket) { socket.close(); socket = null; } }

function showApp(username) {
  $("auth").hidden = true;
  $("app").hidden = false;
  $("who").textContent = username || "";
  refresh();
  connectLive();
}

$("add-toggle").onclick = () => {
  const form = $("add-form");
  form.hidden = !form.hidden;
  $("add-toggle").textContent = form.hidden ? "Show" : "Hide";
};

$("add-form").onsubmit = async (event) => {
  event.preventDefault();
  const msg = $("add-msg");
  msg.className = "msg"; msg.textContent = "";
  try {
    await api("/api/devices/claim", { method: "POST", body: JSON.stringify({
      device_id: $("dev-id").value.trim(),
      claim_code: $("dev-code").value.trim(),
      name: $("dev-name").value.trim() || null,
    }) });
    msg.className = "msg ok"; msg.textContent = "Device added!";
    $("add-form").reset();
    refresh();
  } catch (e) { msg.textContent = e.message; }
};

// ---------- start ----------
(async function start() {
  if (!token) { showAuth(); return; }
  try {
    const list = await api("/api/devices");   // also checks that the saved login still works
    showApp("");
    void list;
  } catch (e) { showAuth(); }
})();
</script>
</body>
</html>
